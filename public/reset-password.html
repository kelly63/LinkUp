<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — LinkUp Athletics</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      max-width: 440px;
      width: 100%;
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #1e3a5f, #2563eb);
      padding: 28px 32px;
    }
    .header h1 { color: #fff; font-size: 22px; margin-bottom: 4px; }
    .header p { color: rgba(255,255,255,0.8); font-size: 14px; }
    .body { padding: 28px 32px; }
    label { display: block; font-size: 13px; color: #374151; font-weight: 600; margin-bottom: 6px; margin-top: 16px; }
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      color: #111827;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="password"]:focus { border-color: #2563eb; }
    .hint { font-size: 12px; color: #9ca3af; margin-top: 4px; }
    .pw-checklist { margin-top: 8px; display: none; }
    .pw-checklist.visible { display: block; }
    .pw-checklist ul { list-style: none; padding: 0; margin: 0; }
    .pw-checklist li { font-size: 12px; display: flex; align-items: center; gap: 6px; padding: 2px 0; color: #9ca3af; }
    .pw-checklist li.ok { color: #16a34a; }
    .pw-checklist li .icon { font-size: 13px; width: 14px; text-align: center; }
    button {
      display: block;
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #93c5fd; cursor: not-allowed; }
    .msg {
      margin-top: 18px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      display: none;
    }
    .msg.success { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; display: block; }
    .msg.error   { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; display: block; }
    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>Reset Your Password</h1>
      <p>LinkUp Athletics</p>
    </div>
    <div class="body">
      <p style="color:#374151;font-size:14px;margin-bottom:4px">Enter a new password for your account.</p>

      <label for="pw">New Password</label>
      <input type="password" id="pw" placeholder="At least 8 characters" autocomplete="new-password" oninput="updateChecklist()" />
      <div class="pw-checklist" id="checklist">
        <ul>
          <li id="chk-len"><span class="icon">○</span> 8+ characters</li>
          <li id="chk-upper"><span class="icon">○</span> One uppercase letter</li>
          <li id="chk-num"><span class="icon">○</span> One number</li>
          <li id="chk-special"><span class="icon">○</span> One special character (!@#$…)</li>
        </ul>
      </div>

      <label for="pw2">Confirm New Password</label>
      <input type="password" id="pw2" placeholder="Repeat your new password" autocomplete="new-password" />

      <button id="btn" onclick="submit()">Set New Password</button>

      <div id="msg" class="msg"></div>
    </div>
  </div>

  <script>
    function getToken() {
      const params = new URLSearchParams(window.location.search);
      return params.get('token') || '';
    }

    function updateChecklist() {
      const pw = document.getElementById('pw').value;
      const checklist = document.getElementById('checklist');
      checklist.className = pw.length > 0 ? 'pw-checklist visible' : 'pw-checklist';
      function setCheck(id, ok) {
        const el = document.getElementById(id);
        el.className = ok ? 'ok' : '';
        el.querySelector('.icon').textContent = ok ? '✓' : '○';
      }
      setCheck('chk-len', pw.length >= 8);
      setCheck('chk-upper', /[A-Z]/.test(pw));
      setCheck('chk-num', /[0-9]/.test(pw));
      setCheck('chk-special', /[^A-Za-z0-9]/.test(pw));
    }

    function validatePassword(pw) {
      if (!pw || pw.length < 8) return 'Password must be at least 8 characters.';
      if (!/[A-Z]/.test(pw)) return 'Password must contain at least one uppercase letter.';
      if (!/[0-9]/.test(pw)) return 'Password must contain at least one number.';
      if (!/[^A-Za-z0-9]/.test(pw)) return 'Password must contain at least one special character.';
      return null;
    }

    async function submit() {
      const pw  = document.getElementById('pw').value.trim();
      const pw2 = document.getElementById('pw2').value.trim();
      const btn = document.getElementById('btn');
      const msg = document.getElementById('msg');

      msg.className = 'msg';
      msg.textContent = '';

      const pwError = validatePassword(pw);
      if (pwError) {
        msg.className = 'msg error';
        msg.textContent = pwError;
        return;
      }
      if (pw !== pw2) {
        msg.className = 'msg error';
        msg.textContent = 'Passwords do not match.';
        return;
      }

      const token = getToken();
      if (!token) {
        msg.className = 'msg error';
        msg.textContent = 'Invalid reset link. Please request a new one.';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';

      try {
        const res = await fetch(`/api/auth/reset-password/${encodeURIComponent(token)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw }),
        });
        const data = await res.json();
        if (res.ok) {
          msg.className = 'msg success';
          msg.textContent = data.message || 'Password updated! You can now sign in to the app.';
          btn.textContent = 'Done';
          document.getElementById('pw').value = '';
          document.getElementById('pw2').value = '';
        } else {
          msg.className = 'msg error';
          msg.textContent = data.message || 'Something went wrong. Please try again.';
          btn.disabled = false;
          btn.textContent = 'Set New Password';
        }
      } catch (e) {
        msg.className = 'msg error';
        msg.textContent = 'Network error. Please check your connection and try again.';
        btn.disabled = false;
        btn.textContent = 'Set New Password';
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('pw').addEventListener('keydown', function(e) { if (e.key === 'Enter') submit(); });
      document.getElementById('pw2').addEventListener('keydown', function(e) { if (e.key === 'Enter') submit(); });
    });
  </script>
</body>
</html>
